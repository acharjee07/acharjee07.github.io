- id: "thermal"
  research: true
  title: "Multimodal 3D Thermal Reconstruction"
  summary: "A drone-based RGB–thermal reconstruction pipeline that adds thermal context to dense 3D building geometry."
  image: "files/thermal-reconstruction.webp"
  image_fit: "contain"
  alt: "RGB and thermal information blended into reconstructed building point clouds"
  description: "Fused drone-captured RGB and thermal imagery into dense 3D building profiles for spatially localized inspection. The case study used 417 captured images and produced approximately 10 million dense points."
  details: "Developed an SfM/MVS pipeline that recovers building geometry with COLMAP and transfers thermal information from sparse to dense point clouds, supporting building inspection and energy diagnostics."
  scope: "Presented in the ASCE i3CE 2025 proceedings and an ICRA Future of Construction workshop poster."
  tags: ["COLMAP", "Open3D", "SfM/MVS", "RGB + LWIR", "3D Perception"]
