- id: "deltaseek"
  research: true
  title: "DeltaSeek: Embodiment-Aware Active Perception"
  summary: "A simulation benchmark comparing chassis- and wrist-mounted sensing on Husky A300 + UR5e, separating observability from travel cost."
  image: "files/deltaseek-robot.webp"
  image_fit: "contain"
  research_image: "files/deltaseek-platform.png"
  alt: "Husky A300 with a UR5e manipulator in the DeltaSeek simulation"
  description: "Developed an embodiment-aware active-perception benchmark using a Husky A300 + UR5e. Across 240 permissible base poses and five arm postures, wrist sensing resolved changes invisible to chassis sensing and reduced median travel from 15.2 m to 6.0 m for mutually observable changes in simulation."
  metrics:
    - value: "240"
      label: "Base poses"
    - value: "5"
      label: "Arm postures"
    - value: "15.2 → 6.0 m"
      label: "Median travel"
  details: "The study separates what a sensing configuration can observe from the cost of reaching a useful viewpoint. For changes observable by both configurations, the paper reports median base travel of 15.2 m for chassis sensing and 6.0 m for wrist sensing."
  scope: "Simulation study on an IFC-derived room with eight controlled changes; results measure geometric visibility and travel, rather than physical-robot detection performance."
  tags: ["ROS 2", "Gazebo", "RGB-D", "IFC", "Active Perception"]
  links:
    - text: "Paper"
      url: "https://arxiv.org/abs/2609.33836"
      icon: "fa fa-file-text-o"
    - text: "Code"
      url: "https://github.com/iSET-LAB/deltaseek"
      icon: "fa fa-github"
    - text: "Details"
      url: "/research.html#deltaseek"
      icon: "fa fa-info-circle"

- id: "lerobot"
  research: true
  title: "LeRobot SO-101 Kinematics & Visual Servoing"
  summary: "Analytical kinematics and Jacobian-based visual servoing, validated in MuJoCo and deployed to a physical SO-101 arm."
  image: "files/lerobot-so101.webp"
  image_fit: "contain"
  alt: "LeRobot SO-101 hardware experiment with image-based target tracking"
  description: "Built analytical forward kinematics, Jacobian-based differential inverse kinematics, and closed-loop image-based visual servoing. Validated the control framework in MuJoCo before deploying it to a physical SO-101 arm."
  details: "Implemented singularity monitoring and predictive joint-limit handling, then connected OpenCV target detection to joint commands for autonomous end-effector positioning."
  scope: "The project repository includes a demonstration of the same control framework running on physical hardware."
  tags: ["Differential IK", "Jacobian Control", "Visual Servoing", "MuJoCo", "LeRobot", "Real Hardware"]
  links:
