- id: "safety"
  research: true
  title: "Scene Graph-Guided Industrial Safety AI"
  summary: "Scene graphs and generative models connect historical accident narratives to visual hazard scenarios and semantic evaluation."
  description: "Developed scene-graph-guided pipelines that turn historical accident narratives into structured hazard scenarios, then generate and evaluate visual training data for industrial safety AI."
